  # DBNatEIP:
  #   Type: AWS::EC2::EIP
  #   Properties:
  #     Domain: vpc
  #     Tags:
  #       - Key: Name
  #         Value: DB-NAT-EIP

  # DBNatGateway:
  #   Type: AWS::EC2::NatGateway
  #   Properties:
  #     SubnetId: !Ref DBPublicSubnet
  #     AllocationId: !GetAtt DBNatEIP.AllocationId
  #     Tags:
  #       - Key: Name
  #         Value: DB-NAT-Gateway

  # DBPrivateDefaultRoute:
  #   Type: AWS::EC2::Route
  #   Properties:
  #     RouteTableId: !Ref DBRouteTable
  #     DestinationCidrBlock: 0.0.0.0/0
  #     NatGatewayId: !Ref DBNatGateway



Outputs:
  VpcId:
    Value: !Ref VPC

  DbVpcId:
    Value: !Ref DBVPC

  PublicSubnets:
    Value: !Join [ ",", [ !Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3 ] ]

  PrivateSubnets:
    Value: !Join [ ",", [ !Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3 ] ]
  
  PrivateSubnet1:
    Value: !Ref PrivateSubnet1
  
  PrivateSubnet2:
    Value: !Ref PrivateSubnet2
  
  PrivateSubnet3:
    Value: !Ref PrivateSubnet3

  PublicSubnet1:
    Value: !Ref PublicSubnet1
  
  PublicSubnet2:
    Value: !Ref PublicSubnet2
  
  PublicSubnet3:
    Value: !Ref PublicSubnet3

  VpcCIDR:
    Value: !Ref VpcCIDR
  DBVPCCIDR:
    Value: !Ref DBVPCCIDR
  DBPrivateSubnet1:
    Value: !Ref DBPrivateSubnet1

  DBPrivateSubnet2:
    Value: !Ref DBPrivateSubnet2

  DBPrivateSubnet3:
    Value: !Ref DBPrivateSubnet3