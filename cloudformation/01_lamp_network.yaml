  #   Properties:
  #     VpcId: !Ref DBVPC
  #     Tags:
  #       - Key: Name
  #         Value: DB-Public-RT

  # DBPublicRoute:
  #   Type: AWS::EC2::Route
  #   DependsOn: DBIGWAttachment
