AWSTemplateFormatVersion: "2010-09-09"
Description: ALB - LAMP compute

Parameters:
  Version:
    Type: String
    Default: "1"
  Environment:
    Type: String
    Default: dev

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro
    Description: EC2 instance type

  KeyName:
    Type: String
    Description: Name of an existing EC2 KeyPair for SSH access


  EC2InstanceProfile:
    Type: String
    Description: EC2InstanceProfile

  Ec2SecurityGroup:
    Type: String
    Description: Ec2SecurityGroup
  
  DBPrivateSubnet1:
    Type: String
    Description: DBPrivateSubnet1
  
  DBInstanceSG:
    Type: String
    Description: DBInstanceSG

  PrivateSubnets:
    Type: CommaDelimitedList
    Description: PrivateSubnets Private subnet IDs for ASG
  
  PrivateSubnet1:
    Type: String
    Description: PrivateSubnet1
  
  PrivateSubnet2:
    Type: String
    Description: PrivateSubnet2
  
  PrivateSubnet3:
    Type: String
    Description: PrivateSubnet3

  PublicSubnet1:
    Type: String
    Description: PublicSubnet1
  
  PublicSubnet2:
    Type: String
    Description: PublicSubnet2
  
  PublicSubnet3:
    Type: String
    Description: PublicSubnet3

  TargetGroup:
    Type: String
    Description: TargetGroup

  DBRootPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Default: rootkampli00
    Description: mysql DB root password
  
  WordPressDBName:
    Type: String
    Default: wordpressdb

  WordPressDBUser:
    Type: String
    Default: wpuser

  WordPressDBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Default: wpkampli00



Resources:


  LampLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: lamp-stack-ec2-LaunchTemplate
      LaunchTemplateData:
        ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        # ImageId: ami-07a5595e036e5def1
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        IamInstanceProfile:
          Name: !Ref EC2InstanceProfile
        Monitoring:
          Enabled: true
        SecurityGroupIds:
          - !Ref Ec2SecurityGroup
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "lamp-stack-pri-subnet-EC2"
              - Key: AutoStop
                Value: true
              - Key: Environment
                Value: dev
        UserData: 
          Fn::Base64:
            !Sub |
              #!/bin/bash -xe
              #set -x for debug only not for production.
              set -x

              yum clean all
              yum update -y
              
              dnf install -y aws-cfn-bootstrap

              /opt/aws/bin/cfn-init \
                --stack ${AWS::StackName} \
                --region ${AWS::Region} \
                --resource LampAutoScalingGroup \
                --configsets default

              INIT_EXIT_CODE=$?

              /opt/aws/bin/cfn-signal \
                --exit-code $INIT_EXIT_CODE \
                --stack ${AWS::StackName} \
                --region ${AWS::Region} \
                --resource LampAutoScalingGroup

              exit $INIT_EXIT_CODE
            

  DBNetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref DBPrivateSubnet1
      GroupSet:
        - !Ref DBInstanceSG
      Description: Primary ENI for MariaDB
      Tags:
        - Key: Name
          Value: MariaDB-Primary-ENI


  LampAutoScalingGroup:
    Type: 'AWS::AutoScaling::AutoScalingGroup'
    
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          default:
            - install
            - configure
            - cfn-hup
        install:
          packages:
            yum:
              # httpd: []
              wget: []
              # php: []
              # php-fpm: []
              # php-mysqlnd: []
              # php-mysqli: []
              # php-devel: []
              # php-gd: []
              # php-json: []
              # mariadb105-server: []
              openssl: []
              # mod_ssl: []
              # stress: []

        configure:

          files:
            /etc/db.conf:
              content: !Sub |
                DB_HOST=${DBNetworkInterface.PrimaryPrivateIpAddress}
              mode: "0644"
              owner: root
              group: root

            /etc/systemd/system/httpd.service.d/aws-env.conf:
              content: !Sub |
                [Service]
                Environment="AWS_REGION=${AWS::Region}"
                Environment="AWS_DEFAULT_REGION=${AWS::Region}"
              mode: "0644"
              owner: root
              group: root

            /var/www/html/lambda_invoke.php:
              content: !Sub |
                <?php
                  require '/var/www/html/vendor/autoload.php';

                  use Aws\Lambda\LambdaClient;
                  use Aws\Exception\AwsException;

                  /**
                  * Get IMDSv2 token
                  */
                  function getImdsToken() {
                      $ch = curl_init('http://169.254.169.254/latest/api/token');
                      curl_setopt_array($ch, [
                          CURLOPT_RETURNTRANSFER => true,
                          CURLOPT_CUSTOMREQUEST  => 'PUT',
                          CURLOPT_HTTPHEADER     => [
                              'X-aws-ec2-metadata-token-ttl-seconds: 21600'
                          ],
                          CURLOPT_TIMEOUT => 2
                      ]);
                      return curl_exec($ch);
                  }

                  /**
                  * Get EC2 metadata value
                  */
                  function getEc2Metadata($path, $token) {
                      $ch = curl_init("http://169.254.169.254/latest/meta-data/$path");
                      curl_setopt_array($ch, [
                          CURLOPT_RETURNTRANSFER => true,
                          CURLOPT_HTTPHEADER     => [
                              "X-aws-ec2-metadata-token: $token"
                          ],
                          CURLOPT_TIMEOUT => 2
                      ]);
                      return curl_exec($ch);
                  }

                  $token = getImdsToken();

                  $metadata = [
                      'availability_zone' => getEc2Metadata('placement/availability-zone', $token),
                      'region'            => getEc2Metadata('placement/region', $token),
                      'instance_id'       => getEc2Metadata('instance-id', $token),
                      'private_ip'        => getEc2Metadata('local-ipv4', $token),
                  ];

                  $client = new LambdaClient([
                      'version' => 'latest',
                      'region'  => $metadata['region']   // dynamically use instance region
                  ]);

                  try {
                      $result = $client->invoke([
                          'FunctionName'   => 'LAMP-DB-Logger',
                          'InvocationType'=> 'RequestResponse',
                          'Payload'       => json_encode([
                              'source'    => 'php-web',
                              'timestamp' => time(),
                              'ec2_metadata'       => $metadata
                          ])
                      ]);

                      $response = json_decode($result->get('Payload')->getContents(), true);

                      echo "<h2>Lambda invoked successfully</h2>";
                      echo "<pre>" . print_r($response, true) . "</pre>";

                  } catch (AwsException $e) {
                      echo "<h2>Error invoking Lambda</h2>";
                      echo "<pre>" . $e->getMessage() . "</pre>";
                  }
                ?>

              mode: "0644"
              owner: root
              group: root

            /var/www/html/ec2_index.php:
              content: !Sub |
                <?php
                  require '/var/www/html/vendor/autoload.php';

                  use Aws\Lambda\LambdaClient;
                  use Aws\Exception\AwsException;

                  /**
                  * Get IMDSv2 token
                  */
                  function getImdsToken() {
                      $ch = curl_init('http://169.254.169.254/latest/api/token');
                      curl_setopt_array($ch, [
                          CURLOPT_RETURNTRANSFER => true,
                          CURLOPT_CUSTOMREQUEST  => 'PUT',
                          CURLOPT_HTTPHEADER     => [
                              'X-aws-ec2-metadata-token-ttl-seconds: 21600'
                          ],
                          CURLOPT_TIMEOUT => 2
                      ]);
                      return curl_exec($ch);
                  }

                  /**
                  * Get EC2 metadata value
                  */
                  function getEc2Metadata($path, $token) {
                      $ch = curl_init("http://169.254.169.254/latest/meta-data/$path");
                      curl_setopt_array($ch, [
                          CURLOPT_RETURNTRANSFER => true,
                          CURLOPT_HTTPHEADER     => [
                              "X-aws-ec2-metadata-token: $token"
                          ],
                          CURLOPT_TIMEOUT => 2
                      ]);
                      return curl_exec($ch);
                  }

                  $token = getImdsToken();

                  $metadata = [
                      'availability_zone' => getEc2Metadata('placement/availability-zone', $token),
                      'region'            => getEc2Metadata('placement/region', $token),
                      'instance_id'       => getEc2Metadata('instance-id', $token),
                      'private_ip'        => getEc2Metadata('local-ipv4', $token),
                  ];

                  

                  try {
                      $response = $metadata;
                      echo "<h2>Welcome to EC2 </h2>";
                      echo "<pre>" . print_r($response, true) . "</pre>";
                  } catch (AwsException $e) {
                      echo "<h2>Error at EC2 home</h2>";
                      echo "<pre>" . $e->getMessage() . "</pre>";
                  }

                  phpinfo();
                ?>

              mode: "0644"
              owner: root
              group: root

          commands:
            01_permissions:
              command: |
                #set -x for debug only not for production.
                set -x
                
                #TODO check why the packages are not installed via config:packages:dnf
                #dnf isnt supported by packages, though not sure why aws wouldn't throw an error, 
                # but very well throws errors for any issues with yum install.
                # yum install is flaky given the repo isnt accessible though user data runs before the install.
                # yum update has been included in the user data.
                dnf upgrade -y
                dnf install -y --allowerasing \
                                httpd wget php php-fpm php-mysqlnd php-mysqli php-json \
                                php-devel php-gd openssl mod_ssl stress nmap-ncat telnet \
                                mariadb105 curl php-cli php-mbstring git unzip
                # mariadb105-server
                WEB_ROOT="/var/www/html"
                INDEX_FILE="$WEB_ROOT/index.php"

                # Ensure web root exists
                mkdir -p "$WEB_ROOT"

                # Create index.php only if it does not exist
                if [ ! -f "$INDEX_FILE" ]; then
                  echo '<?php phpinfo(); ?>' > "$INDEX_FILE"
                fi

                # Fix ownership and permissions
                chown apache:apache "$INDEX_FILE"
                chmod 644 "$INDEX_FILE"
                
                usermod -a -G apache ec2-user || true
                chown -R apache:apache /var/www
                find /var/www -type d -exec chmod 755 {} \;
                find /var/www -type f -exec chmod 644 {} \;

            02_start_services:
              command: |
                #set -x for debug only not for production.
                set -x
                # systemctl enable  mariadb
                systemctl enable httpd 
                # systemctl start mariadb
                # until mysqladmin ping --silent; do sleep 2; done

            05_install_wordpress:
              command: |
                #set -x for debug only not for production.
                set -x
                WEB_ROOT="/var/www/html"
                INDEX_FILE="$WEB_ROOT/index.php"
                mkdir -p "$WEB_ROOT"

                cd /tmp
                if [ ! -d /var/www/html/wp-admin ]; then
                  wget https://wordpress.org/latest.tar.gz
                  tar -xzf latest.tar.gz
                  cp -r wordpress/* /var/www/html/
                fi
                
                cp "/tmp/wordpress/index.php" "$WEB_ROOT/wp_index.php"

                cp -f "$WEB_ROOT/ec2_index.php" "$WEB_ROOT/index.php"

            06_configure_wp:
              command: !Sub |
                #set -x for debug only not for production.
                set -x

                cd /var/www/html
                
                if [ ! -f wp-config.php ]; then
                  cp wp-config-sample.php wp-config.php
                  sed -i "s/database_name_here/${WordPressDBName}/" wp-config.php
                  sed -i "s/username_here/${WordPressDBUser}/" wp-config.php
                  sed -i "s/password_here/${WordPressDBPassword}/" wp-config.php
                  sed -i "s/localhost/${DBNetworkInterface.PrimaryPrivateIpAddress}/" wp-config.php

                  curl -s https://api.wordpress.org/secret-key/1.1/salt/ >> wp-config.php
                fi

            07_fix_wp_permissions:
              command: |
                #set -x for debug only not for production.
                set -x

                chown -R apache:apache /var/www/html
                find /var/www/html -type d -exec chmod 755 {} \;
                find /var/www/html -type f -exec chmod 644 {} \;

            08_generate_self_signed_cert:
              command: |
                #set -x for debug only not for production.
                set -x

                CERT=/etc/pki/tls/certs/apache-selfsigned.crt
                KEY=/etc/pki/tls/private/apache-selfsigned.key

                if [ ! -f "$CERT" ] || [ ! -f "$KEY" ]; then

                  openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                    -keyout $KEY \
                    -out $CERT \
                    -subj "/C=GB/ST=Scotland/L=Glasgow/O=KampliLimited/OU=IT/CN=kamplidev.com/emailAddress=kampli@gmail.com"
                fi

            09_configure_ssl:
              command: |
                #set -x for debug only not for production.
                set -x

                SSL_CONF=/etc/httpd/conf.d/ssl.conf
                sed -i \
                  -e 's|^SSLCertificateFile .*|SSLCertificateFile /etc/pki/tls/certs/apache-selfsigned.crt|' \
                  -e 's|^SSLCertificateKeyFile .*|SSLCertificateKeyFile /etc/pki/tls/private/apache-selfsigned.key|' \
                  $SSL_CONF

            10_restart_httpd:
              command: |
                #set -x for debug only not for production.
                set -x

                testFileName=/var/log/$(date +'%Y%m%d%H%M%S')_touchfile_v1.log
                touch $testFileName
                chmod 777 $testFileName

                systemctl daemon-reexec

                systemctl restart httpd

            11_install_php_composer:
              command: |
                #set -x for debug only not for production.
                set -x

                #dnf install -y --allowerasing curl php-cli php-mbstring git unzip

                mkdir -p $HOME/.config/composer
                export COMPOSER_HOME="$HOME/.config/composer";

                curl -sS https://getcomposer.org/installer -o composer-setup.php
                php composer-setup.php --check
                php composer-setup.php --install-dir=/usr/local/bin --filename=composer

                cd /var/www/html

                composer -q require aws/aws-sdk-php

                export AWS_REGION=${AWS::Region}
                echo $AWS_REGION
                echo $AWS_REGION



          services:
            systemd:
              httpd:
                enabled: true
                ensureRunning: true
              # mariadb:
              #   enabled: true
              #   ensureRunning: true

        cfn-hup:
          files:
            /etc/cfn/cfn-hup.conf:
              mode: "0400"
              owner: root
              group: root
              content: !Sub |
                [main]
                stack=${AWS::StackId}
                region=${AWS::Region}
                interval=1

            /etc/cfn/hooks.d/cfn-auto-reloader.conf:
              mode: "0400"
              owner: root
              group: root
              content: !Sub |
                [cfn-auto-reloader-hook]
                triggers=post.update
                path=Resources.LampAutoScalingGroup.Metadata.AWS::CloudFormation::Init
                action=/opt/aws/bin/cfn-init -v \
                  --stack ${AWS::StackName} \
                  --resource LampAutoScalingGroup \
                  --region ${AWS::Region} \
                  --configsets default
                runas=root

          commands:
            enable_cfn_hup:
              command: |
                #set -x for debug only not for production.
                set -x

                systemctl enable cfn-hup
                systemctl start cfn-hup
                # systemctl status cfn-hup

          services:
            systemd:
              cfn-hup:
                enabled: true
                ensureRunning: true


    CreationPolicy:
      ResourceSignal:
        Timeout: PT30M
        Count: 1
      AutoScalingCreationPolicy:
        MinSuccessfulInstancesPercent: 0

    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT15M
        WaitOnResourceSignals: true

    Properties:
      AutoScalingGroupName: LampAutoScalingGroup
      DesiredCapacity: 0
      MaxSize: 3
      MinSize: 0
      VPCZoneIdentifier: 
      # !Ref PrivateSubnets
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      LaunchTemplate:
        LaunchTemplateId: !Ref LampLaunchTemplate
        # Version: "$Latest"
        Version: !GetAtt LampLaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref TargetGroup
        # - !Ref HttpsTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: AutoStop
          Value: true
          PropagateAtLaunch: true
        - Key: Environment
          Value: dev
          PropagateAtLaunch: true


  # InstanceRefresh:
  #   Type: AWS::AutoScaling::InstanceRefresh
  #   Properties:
  #     AutoScalingGroupName: !Ref LampAutoScalingGroup
  #     Strategy: Rolling
  #     Preferences:
  #       MinHealthyPercentage: 100
  #       InstanceWarmup: 300

  TargetTrackingScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref LampAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50.0
        DisableScaleIn: true




  DBInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DBNetworkInterface
    CreationPolicy:
      ResourceSignal:
        Timeout: PT120M
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          default:
            - configure
            - cfn-hup
        configure:
          commands:
            01_install_mariadb:
              command: |
                #!/bin/bash -xe
                #TODO check why the packages are not installed via config:packages:dnf
                #set -x for debug only not for production.
                set -x
                dnf upgrade -y
                dnf install -y mariadb105-server

                systemctl stop mariadb || true

                mkfs.xfs /dev/xvdf || true
                mkdir -p /var/lib/mysql
                mount /dev/xvdf /var/lib/mysql
                echo "/dev/xvdf /var/lib/mysql xfs defaults,nofail 0 2" >> /etc/fstab

                rm -rf /var/lib/mysql/*
                chown -R mysql:mysql /var/lib/mysql

                mariadb-install-db --user=mysql --datadir=/var/lib/mysql

                sed -i 's/^bind-address.*/bind-address=0.0.0.0/' /etc/my.cnf.d/mariadb-server.cnf

                systemctl enable mariadb
                systemctl start mariadb
            03_secure_mariadb:
              command: !Sub |
                #!/bin/bash -x
                set -x
                # DBRootPassword=rootkampli00
                # WordPressDBName=wordpressdb
                # WordPressDBUser=wpuser
                # WordPressDBPassword=wpkampli00

                # mysql -u ${WordPressDBUser} -p${WordPressDBPassword}
                #  mysql -u root -p${DBRootPassword}


                # Wait for MariaDB
                until mysqladmin ping --silent; do
                  sleep 2
                done

                # Determine how to connect as root
                if mysql -u root -e "SELECT 1" >/dev/null 2>&1; then
                  MYSQL="mysql -u root"
                elif mysql -u root -p"${DBRootPassword}" -e "SELECT 1" >/dev/null 2>&1; then
                  MYSQL="mysql -u root -p${DBRootPassword}"
                else
                  echo "ERROR  Unable to authenticate to MariaDB as root"
                  exit 1
                fi

                # Check if password already matches (idempotent)
                PASSWORD_OK=$($MYSQL -Nse "
                  SELECT COUNT(*) FROM mysql.user
                  WHERE User='root'
                    AND Host='localhost'
                    AND authentication_string = PASSWORD('${DBRootPassword}');
                ")

                if [ "$PASSWORD_OK" -eq 0 ]; then
                  echo "Setting MariaDB root password"
                  $MYSQL -e "
                    ALTER USER 'root'@'localhost' IDENTIFIED BY '${DBRootPassword}';
                    FLUSH PRIVILEGES;
                  "
                else
                  echo "MariaDB root password already set — skipping"
                fi

                
                #mysql -e "ALTER USER IF EXISTS 'root'@'localhost' IDENTIFIED BY '${DBRootPassword}'; FLUSH PRIVILEGES;"
                mysql -u root --password=${DBRootPassword} -e "
                  DELETE FROM mysql.user WHERE User='';
                  DROP DATABASE IF EXISTS test;
                  FLUSH PRIVILEGES;
                "

            04_create_wordpress_db:
              command: !Sub |
                mysql -u root --password=${DBRootPassword} -e "
                  CREATE DATABASE IF NOT EXISTS ${WordPressDBName};
                  CREATE USER IF NOT EXISTS '${WordPressDBUser}'@'%'
                    IDENTIFIED BY '${WordPressDBPassword}';
                  
                  CREATE TABLE IF NOT EXISTS ${WordPressDBName}.logs (
                    id INT AUTO_INCREMENT PRIMARY KEY,
                    message VARCHAR(255),
                    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                  ); 
                  GRANT ALL PRIVILEGES ON ${WordPressDBName}.* TO '${WordPressDBUser}'@'%';
                  FLUSH PRIVILEGES;
                "
                systemctl restart mariadb
                systemctl enable mariadb
                systemctl status mariadb
          services:
            systemd:
              mariadb:
                enabled: true
                ensureRunning: true          
        cfn-hup:
          files:
            /etc/cfn/cfn-hup.conf:
              mode: "0400"
              owner: root
              group: root
              content: !Sub |
                [main]
                stack=${AWS::StackId}
                region=${AWS::Region}
                interval=5

            /etc/cfn/hooks.d/cfn-auto-reloader.conf:
              mode: "0400"
              owner: root
              group: root
              content: !Sub |
                [cfn-auto-reloader-hook]
                triggers=post.update
                path=Resources.DBInstance.Metadata.AWS::CloudFormation::Init
                action=/opt/aws/bin/cfn-init \
                  --stack ${AWS::StackName} \
                  --resource DBInstance \
                  --region ${AWS::Region} \
                  --configsets default
                runas=root

          services:
            systemd:
              cfn-hup:
                enabled: true
                ensureRunning: true

    Properties:
      InstanceType: t2.micro
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      KeyName: !Ref KeyName
      # SubnetId: !Ref DBPrivateSubnet1
      # SecurityGroupIds:
      #   - !Ref DBInstanceSG
      IamInstanceProfile: !Ref EC2InstanceProfile
      NetworkInterfaces:
        - NetworkInterfaceId: !Ref DBNetworkInterface
          DeviceIndex: 0
      Tags:
        - Key: Name
          Value: MariaDB-Primary
        - Key: AutoStop
          Value: true
        - Key: Environment
          Value: dev
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe

          
          dnf install -y aws-cfn-bootstrap

          /opt/aws/bin/cfn-init \
            --stack ${AWS::StackName} \
            --resource DBInstance \
            --region ${AWS::Region} \
            --configsets default

          INIT_EXIT_CODE=$?

          /opt/aws/bin/cfn-signal \
            --exit-code $INIT_EXIT_CODE \
            --stack ${AWS::StackName} \
            --resource DBInstance \
            --region ${AWS::Region}
          
          exit $INIT_EXIT_CODE


  DBDataVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref AWS::Region
      Size: 8
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: MariaDB-Data

  DBVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    DependsOn:
      - DBInstance
      - DBDataVolume
    Properties:
      InstanceId: !Ref DBInstance
      VolumeId: !Ref DBDataVolume
      Device: /dev/xvdf



Outputs:
  
  DBNIPrimaryPrivateIpAddress:
    Value: !GetAtt DBNetworkInterface.PrimaryPrivateIpAddress
  LampLaunchTemplateArn:
    Value: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LampLaunchTemplate}